<div style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto;">
    <h2 style="color: #333;">Help request from {{name}}</h2>
    <p><strong>From:</strong> {{name}} ({{email}})</p>
    <p><strong>Organization:</strong> {{organizationName}}</p>
    <p style="margin: 24px 0; padding: 16px; background-color: #f5f5f5; border-radius: 5px; white-space: pre-wrap;">{{message}}</p>
    <p style="color: #666; font-size: 12px; margin-top: 30px;">Reply directly to this email to respond to {{name}} at {{email}}.</p>
</div>
